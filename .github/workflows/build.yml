name: APK derle

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: 'Telefondan indirilebilir test adayını Releases sayfasına koy'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: APK sürüm kodunu kontrol et
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$((1000 + GITHUB_RUN_NUMBER))
          latest=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name' | awk -F- '$1 == "candidate" && $2 == "build" && $3 ~ /^[0-9]+$/ {if ($3 > max) max=$3} END {print max+0}')
          if [ "$current" -le "$((1000 + latest))" ]; then
            echo "versionCode $current son yayımlanan adayın kodundan büyük değil: $((1000 + latest))"
            exit 1
          fi
          echo "APK versionCode=$current; son aday build=$latest"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub'ın ubuntu sunucularında Android SDK hazır kurulu (ANDROID_HOME).
      - name: Android SDK kontrol
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Kişisel veri taraması
        run: |
          if git ls-files | grep -iE '\.log$|btsnoop|bugreport'; then echo "Kayıt dosyası depoda olmamalı"; exit 1; fi
          if git grep -nIE '([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}' -- . ':!*.md'; then echo "Tam MAC adresi bulundu"; exit 1; fi

      # Sabit imza: anahtar derlemeler arasında önbellekte tutulur, böylece yeni sürüm eskisinin üzerine kurulur.
      - name: İmza anahtarını geri yükle
        uses: actions/cache@v4
        with:
          path: .signing/ls05-debug.keystore
          key: ls05-signing-keystore-v1

      - name: İmza anahtarı yoksa üret
        run: |
          mkdir -p .signing
          if [ ! -f .signing/ls05-debug.keystore ]; then
            echo "Önbellekte anahtar yok, yeni üretiliyor (yalnızca ilk sefer)."
            keytool -genkeypair -keystore .signing/ls05-debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=LS05 Controller,C=TR" -keyalg RSA -keysize 2048 -validity 10000
          else
            echo "Anahtar önbellekten geri yüklendi."
          fi

      - name: Protokol testleri
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :protocol:test

      - name: APK derle (debug)
        env:
          BUILD_SOURCE_BRANCH: ${{ github.ref_name }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: İmza parmak izi
        run: keytool -list -v -keystore .signing/ls05-debug.keystore -storepass android | grep -E 'SHA256' | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: FinnsWatch-${{ github.run_number }}-${{ github.run_attempt }}-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-raporu
          path: protocol/build/reports/tests/

  candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FinnsWatch-${{ github.run_number }}-${{ github.run_attempt }}-apk

      - name: Test adayını yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name' | awk -F- '$1 == "candidate" && $2 == "build" && $3 ~ /^[0-9]+$/ {if ($3 > max) max=$3} END {print max+0}')
          if [ "$GITHUB_RUN_NUMBER" -le "$latest" ]; then
            echo "Bu adaydan daha yeni bir aday yayımlanmış (build $latest)."
            exit 1
          fi
          mv app-debug.apk FinnsWatch-test.apk
          short_sha="${GITHUB_SHA:0:7}"
          tag="candidate-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" FinnsWatch-test.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Finn's Watch test adayı · ${GITHUB_REF_NAME} · ${short_sha} · build ${GITHUB_RUN_NUMBER}" \
            --notes "Test adayı. versionCode: $((1000 + GITHUB_RUN_NUMBER)). APK: build ${GITHUB_RUN_NUMBER}, run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}, commit ${short_sha}, dal ${GITHUB_REF_NAME}. Cihaz sonucu henüz doğrulanmadı." \
            --prerelease
